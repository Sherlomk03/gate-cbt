chat test. Historical PYQ labels are not independently re-verified in this file.","questions":[{"id":"M1","subject":"Mathematics","type":"MCQ","marks":1,"stem":"Let v₁ and v₂ be eigenvectors corresponding to distinct eigenvalues of a real symmetric 3×3 matrix. Which statement is true?","tag":"Previously labeled 2025 EE Q12 (not independently reverified here)","options":["v₁ᵀv₂ ≠ 0","v₁ᵀv₂ = 0","v₁+v₂ = 0","v₁−v₂ = 0"]},{"id":"M2","subject":"Mathematics","type":"MCQ","marks":1,"stem":"Let P be the 3×3 matrix with rows (2,1,0), (−1,0,0), (0,0,1). Let I be the identity matrix. P² equals:","tag":"Previously labeled 2025 EE Q14 (not independently reverified here)","options":["2P−I","P","I","P+I"]},{"id":"M3","subject":"Mathematics","type":"MCQ","marks":1,"stem":"For binary random variables X and Y, the joint probabilities are P(0,0)=1/4, P(1,0)=1/8, P(0,1)=1/2 and P(1,1)=1/8, with arguments (X,Y). Find E[Y|X=1].","tag":"Previously labeled 2025 EE Q15 (not independently reverified here)","options":["1/4","1/2","1/8","1/3"]},{"id":"M4","subject":"Mathematics","type":"NAT","marks":2,"stem":"The joint density f(x,y)=c(x+y) for 0≤x≤1 and 0≤y≤1, and zero elsewhere. Find P(X+Y≤1), to four decimals.","tag":"Original GATE-style"},{"id":"M5","subject":"Mathematics","type":"NAT","marks":1,"stem":"For V(x,y)=x²+x+y²+1, find its rate of change at the origin in the direction toward (1,2), rounded to the nearest integer.","tag":"Previously labeled 2025 EE Q53 (not independently reverified here)"},{"id":"M6","subject":"Mathematics","type":"NAT","marks":1,"stem":"Let x₁′(t)=2x₂(t) and x₂′(t)=r(t), with x₁(0)=1 and x₂(0)=0. For r(t)=1 when t≥0 and 0 otherwise, find x₁(1), rounded to the nearest integer.","tag":"Previously labeled 2025 EE Q54 (not independently reverified here)"},{"id":"M7","subject":"Mathematics","type":"NAT","marks":1,"stem":"Let C be the clockwise-oriented circle |z|=1 and f(z)=jz, where j²=−1. Evaluate ∮C f(z) dz, rounded to the nearest integer.","tag":"Previously labeled 2025 EE Q55 (not independently reverified here)"},{"id":"M8","subject":"Mathematics","type":"MCQ","marks":2,"stem":"Which function is analytic everywhere on the complex plane?","tag":"Original GATE-style","options":["|z|²","e^(z²)","conjugate(z)","Re(z)"]},{"id":"M9","subject":"Mathematics","type":"NAT","marks":2,"stem":"Evaluate ∫₀^∞ x e^(−2x) dx, to four decimals.","tag":"Original GATE-style"},{"id":"M10","subject":"Mathematics","type":"NAT","marks":2,"stem":"Find the minimum value of x²+2y² subject to 2x+y=8.","tag":"Original GATE-style"},{"id":"N1","subject":"Networks","type":"MSQ","marks":2,"stem":"Two circuits have self-inductances L₁ and L₂, mutual inductance M and unity coupling coefficient. Both currents I₁ and I₂ are nonzero. Select all values of I₁/I₂ at which their stored magnetic energy is minimum.","tag":"Previously labeled 2025 EE Q52 (not independently reverified here)","options":["−M/L₁","−M/L₂","−L₁/M","−L₂/M"]},{"id":"N2","subject":"Networks","type":"NAT","marks":2,"stem":"Two clockwise mesh currents I₁ and I₂ share a 4 Ω resistor. The first mesh has an additional 6 Ω resistor and a 20 V source, while the second has an additional 8 Ω resistor and a 12 V source. Both sources drive their respective clockwise mesh currents. Find I₁ in amperes.","tag":"Original GATE-style"},{"id":"N3","subject":"Networks","type":"MCQ","marks":2,"stem":"A reciprocal two-port has impedance matrix Z=[[5,2],[2,8]] Ω. The input admittance Y₁₁ with port 2 short-circuited is:","tag":"Original GATE-style","options":["8/36 S","5/36 S","1/5 S","2/36 S"]},{"id":"N4","subject":"Networks","type":"NAT","marks":2,"stem":"An initially uncharged capacitor C=100 µF is connected at t=0 to a 10 V source through R=2 kΩ. Find the capacitor voltage at t=0.2 s, to three decimals.","tag":"Original GATE-style"},{"id":"N5","subject":"Networks","type":"MSQ","marks":2,"stem":"Which properties are necessary for a driving-point impedance of a passive RLC network?","tag":"Original GATE-style","options":["It is positive real","It has no poles in the open right-half plane","Its real part is nonnegative for Re(s)>0","All its poles must lie strictly on the negative real axis"]},{"id":"N6","subject":"Networks","type":"NAT","marks":2,"stem":"Three resistors 10 Ω, 20 Ω and 40 Ω are connected in star to an ideal balanced 3-phase 400 V line-to-line supply. The neutral is connected to the source neutral. Find the magnitude of current in the 20 Ω branch in amperes, to three decimals.","tag":"Original GATE-style"},{"id":"N7","subject":"Networks","type":"MCQ","marks":1,"stem":"When determining the Thevenin resistance of a linear circuit containing an independent current source and a dependent voltage source, which operation is appropriate?","tag":"Original GATE-style","options":["Open the independent current source and retain the dependent source","Short both sources","Open both sources","Short the independent current source and open the dependent source"]},{"id":"N8","subject":"Networks","type":"NAT","marks":2,"stem":"A first-order low-pass circuit has transfer function H(s)=1000/(s+1000). Find its −3 dB frequency in hertz, to two decimals.","tag":"Original GATE-style"},{"id":"N9","subject":"Networks","type":"MCQ","marks":1,"stem":"A series RLC circuit has R=10 Ω and L=0.1 H. Its angular-frequency bandwidth is:","tag":"Original GATE-style","options":["10 rad/s","100 rad/s","1000 rad/s","1 rad/s"]},{"id":"N10","subject":"Networks","type":"NAT","marks":2,"stem":"A node V is connected to a 20 V node through 5 Ω and to ground through 10 Ω. A voltage-controlled current source of value 0.05V A draws current from the node toward ground. Find V in volts, to three decimals.","tag":"Original GATE-style"},{"id":"P1","subject":"Power Systems","type":"MCQ","marks":1,"stem":"During a power outage, a household UPS supplies a limited set of lights and fans. In a Newton–Raphson power-flow model of this isolated household system, the UPS is represented as:","tag":"Previously labeled 2025 EE Q24 (not independently reverified here)","options":["Slack bus","PV bus","PQ bus","PQV bus"]},{"id":"P2","subject":"Power Systems","type":"NAT","marks":2,"stem":"A three-bus network has prefault voltages of 1 pu. The relevant bus-impedance entries are Z₂₂=j0.25 pu and Z₁₂=j0.10 pu. A bolted three-phase fault occurs at bus 2. Find the magnitude of the voltage at bus 1 during the fault.","tag":"Original GATE-style"},{"id":"P3","subject":"Power Systems","type":"MCQ","marks":2,"stem":"A nominal-π transmission line has total series impedance Z and total shunt admittance Y. Its ABCD parameter A is:","tag":"Original GATE-style","options":["1+YZ/2","1+YZ","YZ/2","1−YZ/2"]},{"id":"P4","subject":"Power Systems","type":"NAT","marks":2,"stem":"Three buses have lossless lines of reactance X₁₂=0.2 pu, X₁₃=0.4 pu and X₂₃=0.2 pu. Bus 1 is the slack with θ₁=0. Net active-power injections at buses 2 and 3 are +0.5 pu and −0.5 pu. Using Pij=(θi−θj)/Xij, find θ₂ in radians.","tag":"Original GATE-style"},{"id":"P5","subject":"Power Systems","type":"MSQ","marks":2,"stem":"For a balanced three-phase set of positive-sequence currents, select the true statements.","tag":"Original GATE-style","options":["The zero-sequence component is zero","The negative-sequence component is zero","The positive-sequence component can be nonzero","All three phase currents are equal phasors"]},{"id":"P6","subject":"Power Systems","type":"NAT","marks":2,"stem":"A generator has sequence reactances X₁=0.2 pu, X₂=0.2 pu and X₀=0.1 pu, with negligible resistance. Its prefault phase voltage is 1 pu. For a solid single-line-to-ground fault with zero fault impedance, find the magnitude of faulted-phase current in pu.","tag":"Original GATE-style"},{"id":"P7","subject":"Power Systems","type":"MCQ","marks":1,"stem":"In an overcurrent protection system, primary and backup relays are coordinated mainly so that:","tag":"Original GATE-style","options":["The backup operates before the primary","The closest appropriate primary relay trips first","All relays trip simultaneously","The farthest relay always trips first"]},{"id":"P8","subject":"Power Systems","type":"NAT","marks":2,"stem":"Two generators have incremental fuel costs dC₁/dP₁=10+0.02P₁ and dC₂/dP₂=12+0.01P₂, with power in MW. Neglect losses and limits. For a total demand of 300 MW, find P₁ in MW, to two decimals.","tag":"Original GATE-style"},{"id":"P9","subject":"Power Systems","type":"MSQ","marks":2,"stem":"Select the correct statements about synchronous-generator transient stability.","tag":"Original GATE-style","options":["Rotor-angle dynamics follow the swing equation","Fault-clearing time can affect stability","Increasing transfer reactance generally increases maximum transferable power","The equal-area criterion can analyze a single-machine infinite-bus system"]},{"id":"P10","subject":"Power Systems","type":"NAT","marks":2,"stem":"A transformer has leakage reactance 0.12 pu on a 50 MVA, 132 kV base. Find its per-unit reactance on a 100 MVA, 132 kV base.","tag":"Original GATE-style"},{"id":"D1","subject":"DC Machines","type":"MCQ","marks":1,"stem":"For a separately excited DC motor with constant field flux, the electromagnetic torque is directly proportional to:","tag":"Original GATE-style","options":["Armature current","Square of armature current","Armature terminal voltage squared","Inverse of speed"]},{"id":"D2","subject":"DC Machines","type":"NAT","marks":2,"stem":"An unsaturated DC series motor operates at speed N₁ with current I₁. Its load torque is proportional to N². If speed decreases to 0.8N₁, find I₂/I₁, to four decimals.","tag":"Original GATE-style"},{"id":"D3","subject":"DC Machines","type":"MCQ","marks":2,"stem":"In a DC generator, armature reaction primarily causes:","tag":"Original GATE-style","options":["Distortion of the main field and a shift in magnetic neutral axis","An increase in pole count","Elimination of commutation","A constant armature current regardless of load"]},{"id":"D4","subject":"DC Machines","type":"NAT","marks":2,"stem":"A 4-pole wave-wound DC generator has 600 armature conductors, flux per pole 0.025 Wb and speed 1000 rpm. Find generated EMF in volts.","tag":"Original GATE-style"},{"id":"D5","subject":"DC Machines","type":"MSQ","marks":2,"stem":"Select all correct statements about starting a DC shunt motor.","tag":"Original GATE-style","options":["At standstill, back EMF is zero","A starter can limit initial armature current","The field circuit should be properly energized","Direct application of rated voltage always produces rated armature current"]},{"id":"D6","subject":"DC Machines","type":"NAT","marks":2,"stem":"A 220 V shunt motor has armature resistance 0.5 Ω. At 20 A armature current, speed is 1000 rpm. Assuming constant field flux, find speed at 40 A armature current in rpm, to two decimals.","tag":"Original GATE-style"},{"id":"D7","subject":"DC Machines","type":"MCQ","marks":1,"stem":"A DC motor operating in regenerative braking mode:","tag":"Original GATE-style","options":["Returns electrical power to the supply","Always dissipates all energy in an external resistor","Has zero back EMF","Must rotate in the reverse direction"]},{"id":"D8","subject":"DC Machines","type":"NAT","marks":2,"stem":"A 20 kW DC generator has constant losses of 400 W and full-load copper losses of 900 W. Assuming copper loss varies as load fraction squared, find the fraction of rated load at maximum efficiency, to four decimals.","tag":"Original GATE-style"},{"id":"D9","subject":"DC Machines","type":"MSQ","marks":2,"stem":"Select the true statements about commutation in a DC machine.","tag":"Original GATE-style","options":["The current in a coil reverses as it passes through the brush zone","Interpoles can improve commutation","Poor commutation may cause sparking","Commutation is unrelated to armature inductance"]},{"id":"D10","subject":"DC Machines","type":"NAT","marks":2,"stem":"A separately excited DC motor has armature voltage 240 V, armature resistan async function loadPaperArchive(){try{const r=await fetch('./pyq/paper-archive-2010-2026.json?_='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();paperArchive=data.records||[];if(view==='archive')archivePage()}catch(e){console.warn('Paper archive unavailable:',e)}}
function pyqPage(){
const subjects=['All',...new Set(pyqBank.map(q=>q.subject))].sort();
const filtered=pyqBank.filter(q=>(pyqFilter==='All'||q.subject===pyqFilter)&&(!pyqSearch||[q.stem,q.topic,q.sourceId].join(' ').toLowerCase().includes(pyqSearch.toLowerCase())));
const attempts=db.pyqAttempts||{};
$('#app').innerHTML='<div class="row"><div><h2>Verified GATE Previous-Year Questions</h2><p class="muted">Individually audited against the official master paper and final answer key. Authentic PYQs only.</p></div><span class="badge">'+pyqBank.length+' authenticated questions</span></div>'+
'<div class="note"><b>Source coverage:</b> 2025 EE and EC only so far. The 2010–2026 multi-year bank is being built; daily 40-question verified-PYQ automation remains disabled until the bank has sufficient eligible questions. These question cards are an individual PYQ practice library, not a new 40-question daily exam. Answers stay hidden until each question is checked.</div>'+
'<div class="card"><div class="filterbar"><select id="pyqSubject">'+subjects.map(v=>'<option '+(pyqFilter===v?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select><input id="pyqSearch" type="search" placeholder="Search topic, model or source ID" value="'+esc(pyqSearch)+'"/></div>'+
(filtered.map(q=>{const a=attempts[q.id],done=!!a?.checked,display=Array.isArray(a?.answer)?a.answer.join(', '):(a?.answer??'');
const isMarked=a?.marked;const aKey=Array.isArray(q.answer)?q.answer.join(', '):q.answer;
return '<article class="revision-card"><div class="row"><b>'+esc(q.sourceId)+'</b><span class="badge">'+esc(q.type)+' · '+q.marks+' mark'+(q.marks===1?'':'s')+'</span></div>'+
'<p class="small muted">'+esc(q.subject)+' / '+esc(q.topic)+' · '+(a?.checked?(a.correct?'Correct':'Incorrect'):isMarked?'Marked for revision':'Unattempted')+'</p>'+
'<div class="revision-stem">'+esc(q.stem)+'</div>'+
(q.type==='NAT'?'<label>Numerical answer <input class="nat pyq-nat" data-q="'+esc(q.id)+'" value="'+esc(display)+'" inputmode="decimal" placeholder="Enter numerical answer" '+(done?'disabled':'')+'></label>':
(q.options||[]).map((option,i)=>{const letter='ABCD'[i];const checked=Array.isArray(a?.answer)?a.answer.includes(letter):a?.answer===letter;
return '<label class="choice"><input class="pyq-choice" data-q="'+esc(q.id)+'" type="'+(q.type==='MSQ'?'checkbox':'radio')+'" name="pyq-'+esc(q.id)+'" value="'+letter+'" '+(checked?'checked':'')+' '+(done?'disabled':'')+'><b>'+letter+'.</b> <span>'+esc(option)+'</span></label>'}).join(''))+
'<div class="row"><div class="row"><button class="btn primary pyq-check" data-q="'+esc(q.id)+'" '+(done?'disabled':'')+'>Check answer</button><button class="btn pyq-mark" data-q="'+esc(q.id)+'">'+(isMarked?'★ Unmark':'☆ Mark for revision')+'</button></div><span class="small"><a target="_blank" rel="noopener" href="'+esc(q.paperUrl)+'">Official paper</a> · <a target="_blank" rel="noopener" href="'+esc(q.keyUrl)+'">Official key</a></span></div>'+
(done?'<div class="note" style="margin-top:12px"><b>'+((a.correct)?'Correct':'Incorrect')+'</b> · Your answer: '+esc(display||'Not answered')+' · Official answer: '+esc(aKey)+'<p>'+esc(q.explanation||'')+'</p></div>':'')+
'</article>'}).join('')||'<p>No verified PYQs match this search.</p>')+'</div>';
$('#pyqSubject').onchange=e=>{pyqFilter=e.target.value;pyqPage()};
$('#pyqSearch').oninput=e=>{pyqSearch=e.target.value;pyqPage();let z=$('#pyqSearch');z.focus();z.setSelectionRange(pyqSearch.length,pyqSearch.length)};
document.querySelectorAll('.pyq-choice,.pyq-nat').forEach(el=>el.onchange=()=>{const id=el.dataset.q,q=pyqBank.find(z=>z.id===id);db.pyqAttempts??={};const a=db.pyqAttempts[id]??={};if(a.checked)return;if(q.type==='NAT')a.answer=el.value;else if(q.type==='MCQ')a.answer=el.value;else a.answer=[...document.querySelectorAll('input[data-q="'+id+'"]:checked')].map(i=>i.value).sort();save()});
document.querySelectorAll('.pyq-nat').forEach(el=>el.oninput=e=>{db.pyqAttempts??={};(db.pyqAttempts[el.dataset.q]??={}).answer=el.value;save()});
document.querySelectorAll('.pyq-mark').forEach(el=>el.onclick=()=>{db.pyqAttempts??={};const a=db.pyqAttempts[el.dataset.q]??={};a.marked=!a.marked;save();pyqPage()});
document.querySelectorAll('.pyq-check').forEach(el=>el.onclick=()=>{const q=pyqBank.find(z=>z.id===el.dataset.q);db.pyqAttempts??={};const a=db.pyqAttempts[q.id]??={};const v=a.answer;const responded=Array.isArray(v)?v.length>0:String(v??'').trim()!=='';if(!responded){toast('Choose an answer before checking');return}
let good;if(q.type==='MCQ')good=v===q.answer;else if(q.type==='MSQ')good=Array.isArray(v)&&v.slice().sort().join(',')===q.answer.slice().sort().join(',');else good=Number.isFinite(Number(v))&&Math.abs(Number(v)-Number(q.answer))<=Number(q.tolerance??0.005);
a.correct=good;a.checked=true;a.checkedAt=new Date().toISOString();save();
if(!good){const record={paperId:'verified-pyq-bank',date:new Date().toISOString().slice(0,10),id:q.id,subject:q.subject,topic:q.topic,stem:q.stem,options:q.options,type:q.type,answer:v,correct:q.answer,explanation:q.explanation,status:'wrong',paperUrl:q.paperUrl,keyUrl:q.keyUrl};if(!db.prior.some(x=>x.paperId===record.paperId&&x.id===record.id)){db.prior.push(record);save()}}
pyqPage()});
}
async function loadPyqBank(){try{const r=await fetch('./pyq/verified-bank.json?_='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();pyqBank=(data.questions||[]).filter(q=>q.verified&&q.paperUrl&&q.keyUrl&&q.sourceId&&q.answer!==undefined);if(view==='pyq')pyqPage()}catch(e){console.warn('Verified PYQ bank unavailable:',e)}}
function mistakes(){const items=[...rows().map(x=>({...x,origin:'submitted'})),...db.prior.map(x=>({...x,origin:'historical'}))].filter(x=>revisionFilter==='all'?true:revisionFilter==='missed'?['wrong','skipped'].includes(x.status):x.status===revisionFilter).filter(x=>subFilter==='All'||x.subject===subFilter).filter(x=>topicFilter==='All'||x.topic===topicFilter).filter(x=>!searchTerm||(x.stem+' '+x.topic+' '+x.subject).toLowerCase().includes(searchTerm.toLowerCase()));const all=[...rows(),...db.prior];const subjects=['All',...new Set(all.map(x=>x.subject))].sort();const topics=['All',...new Set(all.filter(x=>subFilter==='All'||x.subject===subFilter).map(x=>x.topic))].sort();$('#app').innerHTML=`<div class="row"><h2>Wrong answers · Topic-wise revision</h2><span class="badge">${items.length} questions</span></div><div class="note">Shows missed questions ordered by subject and topic. Each question and its options are shown directly. Expand the explanation when needed. Older records without complete source text are clearly marked. Records without a verified key are labeled ungraded instead of being guessed.</div><div class="card"><div class="filterbar"><select id="kind">${[['wrong','Wrong only'],['missed','Wrong + skipped'],['skipped','Skipped only'],['all','All questions']].map(([v,l])=>`<option value="${v}" ${revisionFilter===v?'selected':''}>${l}</option>`).join('')}</select><select id="sub">${subjects.map(s=>`<option ${subFilter===s?'selected':''}>${esc(s)}</option>`).join('')}</select><select id="topic">${topics.map(s=>`<option ${topicFilter===s?'selected':''}>${esc(s)}</option>`).join('')}</select><input type="search" id="find" placeholder="Find question or topic" value="${esc(searchTerm)}"><button class="btn" id="exportMistakes">Export revision list</button></div>${groupItems(items)}</div>`;$('#kind').onchange=e=>{revisionFilter=e.target.value;mistakes()};$('#sub').onchange=e=>{subFilter=e.target.value;topicFilter='All';mistakes()};$('#topic').onchange=e=>{topicFilter=e.target.value;mistakes()};$('#find').oninput=e=>{searchTerm=e.target.value;const focus=document.activeElement;mistakes();$('#find').focus();$('#find').setSelectionRange(searchTerm.length,searchTerm.length)};$('#exportMistakes').onclick=()=>download('gate-topic-revision.json',items)}
function groupItems(items){
const grouped={};for(const x of items){const k=x.subject+'|||'+(x.topic||'Unclassified');(grouped[k]??=[]).push(x)}
return Object.entries(grouped).sort((a,b)=>a[0].localeCompare(b[0])).map(([group,rr])=>{
const [s,t]=group.split('|||');
return '<h3>'+esc(s)+' → '+esc(t)+' <span class="badge">'+rr.length+'</span></h3>'+
rr.map(x=>{
const statusColor=x.status==='wrong'?'#b44949':x.status==='skipped'?'#927320':'#58708c';
const user=Array.isArray(x.answer)?x.answer.join(', '):(x.answer??'');
const correct=Array.isArray(x.correct)?x.correct.join(', '):x.correct;
const options=Array.isArray(x.options)&&x.options.length?'<div class="revision-options">'+x.options.map((opt,i)=>'<div><b>'+String.fromCharCode(65+i)+'.</b> '+esc(opt)+'</div>').join('')+'</div>':'';
const validStem=!!x.stem&&!/original full stem not yet imported|detailed stem is in the past chat|question [A-Z][0-9]+ from 18 nov/i.test(x.stem);
const imageHtml=x.imagePath?'<img class="revision-source-img" loading="lazy" alt="Original historical GATE question image" src="'+esc(x.imagePath)+'">':'';
return '<article class="revision-card"><div class="row"><span class="small" style="color:'+statusColor+';font-weight:750">'+esc(x.status.toUpperCase())+' · '+esc(x.date)+' · '+esc(x.id)+'</span><span class="badge">'+esc(x.type||'Practice')+'</span></div>'+
'<div class="revision-stem">'+(validStem?esc(x.stem):'<span class="muted">Full question text is not available for this historical record.</span>')+'</div>'+imageHtml+options+
'<div class="revision-answers"><div><span class="muted">Your answer</span><b>'+esc(user||'Skipped')+'</b></div><div><span class="muted">Correct answer</span><b>'+esc(correct===null||correct===undefined?'Not available':correct)+'</b></div></div>'+
(x.explanation?'<details class="revision-explanation"><summary>Show explanation</summary><p>'+esc(x.explanation)+'</p></details>':'<p class="small muted">No explanation recorded.</p>')+'</article>'}).join('')
}).join('')||'<p class="muted">No questions match these filters.</p>'}
function settings(){$('#app').innerHTML=`<h2>Synchronization and backups</h2><div class="card stack"><h3>Daily paper feed</h3><p>When hosted, the app checks <code>papers/manifest.json</code> for newly published date-specific questions. A scheduled GitHub workflow can publish at approximately 8 AM IST, subject to platform delays.</p><label for="feed">Manifest URL</label><input class="nat" style="max-width:100%" id="feed" value="${esc(db.feed)}"><div class="row"><button class="btn primary" id="setFeed">Save feed URL</button><button class="btn" id="refresh">Check now</button></div><div id="last" class="small muted">${esc(db.lastSync||'Not yet synchronized')}</div></div><div class="card stack"><h3>Data safety</h3><p class="muted">All attempts, paper history and revision data are stored on this browser/device. Other browsers and devices do not share them automatically.</p><div class="row"><button class="btn" id="backup">Download complete backup</button><button class="btn" id="import">Import backup or daily paper</button><button class="btn warn" id="clearAll">Erase local workspace</button></div></div><div class="card"><h3>Other paper collections</h3><p class="muted">These are available when you need them, but are intentionally kept out of the main navigation.</p><p><a href="./five-years.html">2022–2026 full official paper exam mode</a></p><p><button class="btn" id="showVerified">Standalone verified PYQ starter bank</button></p><p><button class="btn" id="showArchive">2010–2026 historical paper archive</button></p><p><button class="btn" id="showLegacy">Legacy test room</button></p></div><div class="card"><h3>Automatic generation and authenticity</h3><p>Automatic original-question generation is <b>disabled</b>. The hosting workflow only publishes the existing paper library; future 8 AM IST updates must use an independently verified PYQ database with official paper-and-key provenance. The 20 November seed paper is <b>not independently verified</b> and has no authenticated automatic grading key.</p></div>`;$('#showVerified').onclick=()=>site('pyq');$('#showArchive').onclick=()=>site('archive');$('#showLegacy').onclick=()=>site('exam');$('#setFeed').onclick=()=>{db.feed=$('#feed').value.trim();save();toast('Feed URL saved')};$('#refresh').onclick=refresh;$('#backup').onclick=backup;$('#import').onclick=()=>$('#importFile').click();$('#clearAll').onclick=()=>{if(confirm('Erase all locally saved papers and attempts? Export first.')){localStorage.removeItem(K);location.reload()}}}
function download(name,object){const blob=new Blob([JSON.stringify(object,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function backup(){download('gate-cbt-all-history-backup.json',{format:'gate-cbt-v2-backup',exportedAt:new Date().toISOString(),data:db});toast('Full backup downloaded')}
async function refresh(){try{const url=new URL(db.feed,location.href);url.searchParams.set('_',Date.now());const resp=await fetch(url,{cache:'no-store'});if(!resp.ok)throw Error('Manifest unavailable ('+resp.status+')');const manifest=await resp.json();if(!Array.isArray(manifest.papers))throw Error('Invalid manifest');let added=0;for(const entry of manifest.papers){if(!entry.id||!entry.file||db.papers[entry.id])continue;const fileUrl=new URL(entry.file,url);let r=await fetch(fileUrl,{cache:'no-store'});if(!r.ok)continue;try{const item=valid(await r.json());addPaper(item);added++}catch(e){console.warn('Paper rejected',entry.id,e)}}db.lastSync='Last checked '+new Date().toLocaleString()+' · '+added+' new papers';save();toast(added?added+' new papers added':'No new papers found');render()}catch(e){toast('Could not synchronize: '+e.message)}}
$('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(data.format==='gate-cbt-v2-backup'&&data.data?.papers){if(!confirm('Merge imported papers and attempts with this device?'))return;db.papers={...db.papers,...data.data.papers};db.attempts={...db.attempts,...data.data.attempts};db.prior=[...db.prior,...(data.data.prior||[])];save();toast('Backup merged')}else if(data.questions){addPaper(data);toast('Paper added to library')}else throw Error('Unrecognized file format');render()}catch(e){alert(e.message)}finally{e.target.value=''}};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>site(b.dataset.view));setInterval(()=>{if(view!=='exam'||!paper())return;const a=attempt(paper().id);if(!a.submittedAt){const rem=remaining(paper(),a);if($('#clock'))$('#clock').textContent=timerStr(rem);if(rem===0&&!a.pausedAt){a.submittedAt=Date.now();save();toast('Time finished: attempt saved');site('history')}}},1000);
async function boot(){const seed=JSON.parse($('#offlineSeed').textContent);if(seed.paper&&!db.papers[seed.paper.id])addPaper(seed.paper);
// Enrich existing local mistake records without discarding submitted answers, marks, dates or custom notes.
const existing=new Map((db.prior||[]).map(p=>[p.date+'|'+p.id,p]));
for(const record of seed.prior||[]){const k=record.date+'|'+record.id;const old=existing.get(k);if(!old){db.prior.push(record);continue}
const isPlaceholder=!old.stem||/original full stem not yet imported|detailed stem is in the past chat|question [A-Z][0-9]+ from 18 nov/i.test(old.stem);
if(isPlaceholder)old.stem=record.stem;
if(!old.options&&record.options)old.options=record.options;
if(!old.type&&record.type)old.type=record.type;
if((old.correct===null||old.correct===undefined)&&record.correct!==null&&record.correct!==undefined)old.correct=record.correct;
}
save();render();loadPyqBank().catch(()=>{});loadPaperArchive().catch(()=>{});refresh().catch(()=>{})}boot();
