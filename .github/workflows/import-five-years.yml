name: Import official GATE EE EC papers 2022-2026
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/import_five_years.py
      - .github/workflows/import-five-years.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF processing libraries
        run: python -m pip install --quiet requests pymupdf pdfplumber
      - name: Import official key-matched questions for five years
        run: python scripts/import_five_years.py
      - name: Commit imported paper metadata
        run: |
          git config user.name "gate-cbt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pyq/five-years/
          if ! git diff --staged --quiet; then
            git commit -m "Import GATE 2022-2026 EE EC official keys and PDF-linked questions"
            git push
          fi
