name: Publish GATE CBT website (verified paper library)
# Includes official 2022–2026 linked-paper data, screenshots and daily source-authentic PYQ exams
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'five-years.html'
      - 'daily-pyq.html'
      - 'performance.html'
      - 'pyq-library.html'
      - 'papers/**'
      - 'pyq/**'
      - '.github/workflows/deploy.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gate-cbt-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify PYQ subject labels, answer keys and future eligibility
        run: python scripts/validate_taxonomy.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy website to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
