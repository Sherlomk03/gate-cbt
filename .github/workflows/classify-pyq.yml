name: Classify historic GATE PYQs by subject and topic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/classify_pyq_topics.py'
      - '.github/workflows/classify-pyq.yml'
permissions:
  contents: write
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text tools
        run: python -m pip install --quiet requests pymupdf
      - name: Classify 550 GATE question records
        run: python scripts/classify_pyq_topics.py
      - name: Validate classifications and commit
        run: |
          python - <<'PY'
          import json,pathlib
          paths=list(pathlib.Path('pyq/five-years').glob('20??-??.json'))
          assert len(paths)==10
          for path in paths:
            data=json.loads(path.read_text())
            assert len(data['questions'])==65
            for q in data['questions'][10:]:
              assert q['imagePath'] and q['subject'] and q['topic'] and q['classificationStatus']
          print('550 source-linked questions classified')
          PY
          git config user.name "gate-cbt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pyq/five-years/
          if ! git diff --staged --quiet; then
            git commit -m "Add provisional subject and topic tags to 550 EE EC PYQs"
            git fetch origin main
            git rebase origin/main
            git push
          fi
