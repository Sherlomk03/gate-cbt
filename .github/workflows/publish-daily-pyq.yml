name: Publish Daily GATE PYQ and ACE Classroom Practice
on:
  schedule:
    # 07:50 IST each day; GitHub scheduled runs can be delayed.
    - cron: '20 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_daily_pyq.py'
      - 'scripts/validate_taxonomy.py'
      - '.github/workflows/publish-daily-pyq.yml'
permissions:
  contents: write
concurrency:
  group: gate-daily-pyq-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select 40 daily official PYQs plus labeled ACE Signals questions
        run: |
          python scripts/publish_daily_pyq.py
          # Prepublish first Signals rotation for 22 Nov; later runs leave it unchanged.
          python scripts/publish_daily_pyq.py 2026-11-22
      - name: Validate source taxonomy and every published question
        run: python scripts/validate_taxonomy.py
      - name: Audit and commit
        run: |
          python - <<'PY'
          import json,pathlib
          entries=list(pathlib.Path('papers/daily-pyq').glob('20??-??-??.json'))
          assert entries
          for f in entries:
              d=json.loads(f.read_text())
              q=d['questions']
              assert len(q)==40 and len({x['id'] for x in q})==40
              if not d.get('taxonomyCorrectedAt'):
                  assert [sum(x['subject']==subject for x in q) for subject in d['subjects']]==[10,10,10,10]
                  assert all(x.get('sourceType')=='ace_classroom' or x.get('selectionEligibleForFuture') is True for x in q)
              else:
                  # Historical papers are never rebalanced after a corrected taxonomy;
                  # IDs, answer keys and previously saved answers must remain stable.
                  assert sum(d['actualSubjectCounts'].values()) == 40
              assert all(x['officialKey'] for x in q)
              assert all((x.get('sourceType')=='ace_classroom' and x.get('stem') and isinstance(x.get('options'),list) and x.get('officialGatePYQ') is False) or (x.get('imagePath') and x.get('paperUrl') and x.get('keyUrl')) for x in q)
              ace=[x for x in q if x.get('sourceType')=='ace_classroom']
              assert not ace or all(x['subject']=='Signals & Systems' for x in ace)
          print('Daily question-source inventory checked:',len(entries))
          PY
          git config user.name "gate-cbt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add papers/daily-pyq/
          if ! git diff --staged --quiet; then
            git commit -m "Publish next 40-question source-authentic GATE PYQ daily test"
            git fetch origin main
            git rebase origin/main
            git push
          fi
