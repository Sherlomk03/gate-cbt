name: Build individual GATE 2022-2026 question images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_question_crops.py'
      - '.github/workflows/question-crops.yml'
permissions:
  contents: write
concurrency:
  group: gate-question-image-import
  cancel-in-progress: false
jobs:
  crop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and PDF tools
        run: python -m pip install --quiet requests pymupdf pillow
      - name: Crop original official PDFs by question
        run: python scripts/generate_question_crops.py
      - name: Check 550 images were created
        run: |
          test "$(find pyq/five-years/crops -name '*.webp' | wc -l)" -eq 550
          python - <<'PY'
          import json,pathlib
          base=pathlib.Path('pyq/five-years')
          for p in base.glob('20??-??.json'):
              j=json.loads(p.read_text())
              assert len(j['questions']) == 65
              for q in j['questions'][10:]:
                  assert (base/q['imagePath']).stat().st_size > 1000
          print('550 question crops and ten paper files verified')
          PY
      - name: Commit source-image crops with up-to-date branch
        run: |
          git config user.name "gate-cbt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pyq/five-years/
          if ! git diff --staged --quiet; then
            git commit -m "Publish 550 original-PDF question crops for 2022-2026 EE EC"
            git fetch origin main
            git rebase origin/main
            git push
          fi
